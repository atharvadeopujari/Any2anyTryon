<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Try-On</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .input-section {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .image-upload {
            flex: 1;
            min-width: 300px;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 5px;
        }
        .preview-image {
            width: 100%;
            height: 300px;
            object-fit: contain;
            border: 1px dashed #aaa;
            margin-top: 10px;
        }
        .params-section {
            flex: 1;
            min-width: 300px;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .result-section {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 5px;
        }
        .result-image {
            max-width: 100%;
            max-height: 500px;
            display: block;
            margin: 0 auto;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin: 20px 0;
        }
        .error {
            color: red;
            padding: 10px;
            background-color: #ffeeee;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Virtual Try-On</h1>
    <p>Upload a model image and a garment image to see how the garment looks on the model.</p>
    
    <div class="container">
        <div class="input-section">
            <div class="image-upload">
                <h3>Model Image</h3>
                <input type="file" id="modelImageInput" accept="image/*">
                <img id="modelPreview" class="preview-image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Model Preview">
            </div>
            
            <div class="image-upload">
                <h3>Garment Image</h3>
                <input type="file" id="garmentImageInput" accept="image/*">
                <img id="garmentPreview" class="preview-image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Garment Preview">
            </div>
        </div>
        
        <div class="params-section">
            <h3>Generation Parameters</h3>
            
            <div class="form-group">
                <label for="promptInput">Prompt:</label>
                <textarea id="promptInput" rows="3"><MODEL> a person with fashion garment. <GARMENT> a garment. <TARGET> model with fashion garment</textarea>
            </div>
            
            <div class="form-group">
                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label for="heightInput">Height:</label>
                        <input type="number" id="heightInput" value="576" min="384" max="1024">
                    </div>
                    <div style="flex: 1;">
                        <label for="widthInput">Width:</label>
                        <input type="number" id="widthInput" value="576" min="384" max="1024">
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label for="seedInput">Seed:</label>
                        <input type="number" id="seedInput" value="0" min="0">
                    </div>
                    <div style="flex: 1;">
                        <label for="guidanceScaleInput">Guidance Scale:</label>
                        <input type="number" id="guidanceScaleInput" value="3.5" min="0" step="0.1">
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="stepsInput">Inference Steps:</label>
                <input type="number" id="stepsInput" value="15" min="1" max="50">
            </div>
            
            <button id="generateButton">Generate Try-On Image</button>
            <div id="errorMessage" class="error" style="display: none;"></div>
        </div>
        
        <div class="result-section">
            <h3>Result</h3>
            <div id="loadingMessage" class="loading" style="display: none;">Processing... This may take a minute.</div>
            <img id="resultImage" class="result-image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Result will appear here">
        </div>
    </div>

    <script>
        // API endpoint URL - change this to your actual endpoint
        const API_URL = 'http://localhost:5000/api/tryon';
        
        // Elements
        const modelImageInput = document.getElementById('modelImageInput');
        const garmentImageInput = document.getElementById('garmentImageInput');
        const modelPreview = document.getElementById('modelPreview');
        const garmentPreview = document.getElementById('garmentPreview');
        const promptInput = document.getElementById('promptInput');
        const heightInput = document.getElementById('heightInput');
        const widthInput = document.getElementById('widthInput');
        const seedInput = document.getElementById('seedInput');
        const guidanceScaleInput = document.getElementById('guidanceScaleInput');
        const stepsInput = document.getElementById('stepsInput');
        const generateButton = document.getElementById('generateButton');
        const resultImage = document.getElementById('resultImage');
        const loadingMessage = document.getElementById('loadingMessage');
        const errorMessage = document.getElementById('errorMessage');
        
        // Preview uploaded images
        modelImageInput.addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    modelPreview.src = e.target.result;
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        });
        
        garmentImageInput.addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    garmentPreview.src = e.target.result;
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        });
        
        // Generate try-on image
        generateButton.addEventListener('click', async function() {
            // Validate inputs
            if (!modelImageInput.files[0] && !garmentImageInput.files[0]) {
                showError('Please upload at least one image (model or garment)');
                return;
            }
            
            // Prepare form data
            const formData = new FormData();
            
            if (modelImageInput.files[0]) {
                formData.append('model_image', modelImageInput.files[0]);
            }
            
            if (garmentImageInput.files[0]) {
                formData.append('garment_image', garmentImageInput.files[0]);
            }
            
            formData.append('prompt', promptInput.value);
            formData.append('height', heightInput.value);
            formData.append('width', widthInput.value);
            formData.append('seed', seedInput.value);
            formData.append('guidance_scale', guidanceScaleInput.value);
            formData.append('num_inference_steps', stepsInput.value);
            
            // Show loading and disable button
            loadingMessage.style.display = 'block';
            resultImage.style.display = 'none';
            generateButton.disabled = true;
            errorMessage.style.display = 'none';
            
            try {
                // Send request to API
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData,
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Unknown error occurred');
                }
                
                // Display the result
                resultImage.src = 'data:image/png;base64,' + data.image;
                resultImage.style.display = 'block';
            } catch (error) {
                showError('Error: ' + error.message);
            } finally {
                // Hide loading and enable button
                loadingMessage.style.display = 'none';
                generateButton.disabled = false;
            }
        });
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }
    </script>
</body>
</html>
